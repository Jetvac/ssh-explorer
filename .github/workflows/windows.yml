name: Windows build and regression
on:
  push:
    branches: [main, 'codex/**', 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare isolated SSH test fixture dependencies
        shell: pwsh
        run: |
          python -m venv .tools/auth-ci-python
          if ($LASTEXITCODE -ne 0) { throw 'Test Python environment creation failed.' }
          & .tools/auth-ci-python/Scripts/python.exe -m pip install -r scripts/testing/requirements-auth.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fixture dependency installation failed.' }
      - name: Build, run regression checks, package portable EXE
        id: package
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -RequireClean
          ./scripts/Package-Source.ps1 -RequireClean
      - name: System Evergreen WebView2 on the runner (terminal engine of the standard package)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue).pv
          if (-not $pv -or $pv -eq '0.0.0.0') { throw 'Evergreen WebView2 Runtime is not installed on the runner.' }
          if ([version]$pv -lt [version]'120.0.0.0') { throw "Evergreen WebView2 Runtime $pv is older than the 120.0.0.0 minimum." }
          [ordered]@{ evergreen = $pv; minimum = '120.0.0.0' } | ConvertTo-Json | Set-Content artifacts/webview2-system.json -Encoding utf8
          Get-Content artifacts/webview2-system.json
      - name: Optional kit with Fixed WebView2 Runtime (tags and manual runs only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -RequireClean -SkipTests -WithFixedRuntime
      - name: Authentication network and ordinary WPF command route
        shell: pwsh
        run: ./scripts/Test-AuthNetwork.ps1 -Python .tools/auth-ci-python/Scripts/python.exe -RunOrdinaryUi
      - name: UI interactions, metric cells and exact beta.4 comparison renders
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/Test-UiComposition.ps1
      - name: OpenSSH Server on the runner with a throwaway local administrator (Windows servers over SSH)
        id: winssh
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
          Write-Output "OpenSSH Server capability: $($cap.Name) $($cap.State)"
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
          Start-Service sshd
          $user = 'sshx-ssh'
          $bytes = [byte[]]::new(24); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = 'Bb2!' + ([Convert]::ToBase64String($bytes) -replace '[/+=]', 'x')
          Write-Output "::add-mask::$password"
          New-LocalUser -Name $user -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-544' -Member $user
          "WIN_SSH_USER=$user" >> $env:GITHUB_ENV
          "WIN_SSH_PASSWORD=$password" >> $env:GITHUB_ENV
          $ok = (Test-NetConnection 127.0.0.1 -Port 22 -WarningAction SilentlyContinue).TcpTestSucceeded
          Write-Output "sshd on 127.0.0.1:22 reachable: $ok"
          if (-not $ok) { throw 'sshd is not listening.' }
      - name: Windows server over SSH (detection, drive paths, PowerShell, task manager, server page)
        if: ${{ !cancelled() && steps.winssh.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-build -- --windows-host-integration 127.0.0.1 22 $env:WIN_SSH_USER 2>&1 | Tee-Object -FilePath artifacts/windows-host.log
          if ($LASTEXITCODE) { throw 'Windows server checks failed.' }
      - name: Remote Desktop on the runner with a throwaway local account (live RDP sign-in to itself)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $user = 'sshx-rdp'
          $bytes = [byte[]]::new(24); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = 'Aa1!' + ([Convert]::ToBase64String($bytes) -replace '[/+=]', 'x')
          Write-Output "::add-mask::$password"
          New-LocalUser -Name $user -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-555' -Member $user
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Start-Service TermService
          $ok = (Test-NetConnection 127.0.0.2 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
          Write-Output "RDP listener on 127.0.0.2:3389 reachable: $ok"
          "RDP_TEST_USER=$user" >> $env:GITHUB_ENV
          "RDP_TEST_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: beta.6 user actions (tabs after Show, address input, caption, sorting, graphs, panels, icons)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ui-beta6 | Out-Null
          dotnet run --project tests/SSHExplorer.UiTests/SSHExplorer.UiTests.csproj -c Release --no-build -- --beta6-ui --render-dir artifacts/ui-beta6 2>&1 | Tee-Object -FilePath artifacts/ui-beta6.log
          if ($LASTEXITCODE) { throw 'beta.6 user-action checks failed.' }
      - name: Package composition and EXE icon resource
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props
          $version = [string]$properties.Project.PropertyGroup.Version
          $folder = "artifacts/SSHExplorer-$version-win-x64"
          ./scripts/Measure-Package.ps1 -Directory $folder -Zip "$folder.zip" -Report artifacts/package-measurements.json | Out-Host
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "$folder/SSHExplorer.exe").Path)
          $bitmap = $icon.ToBitmap(); $bitmap.Save((Join-Path $PWD 'artifacts/exe-associated-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          "EXE associated icon: $($bitmap.Width)x$($bitmap.Height) (taskbar/Alt+Tab use the same resource)" >> $env:GITHUB_STEP_SUMMARY
      - name: Packaged EXE startup and graceful close in isolated settings
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props
          $version = [string]$properties.Project.PropertyGroup.Version
          ./scripts/Test-PortableStartup.ps1 -Directory "artifacts/SSHExplorer-$version-win-x64" -ExpectedCommit $env:GITHUB_SHA -ExpectedVersion $version
      - name: Record scope of CI checks
        if: always()
        shell: pwsh
        run: |
          'CI exercises core regressions, WPF layout/state, motion clocks, profile STA dialogs, ordinary Add/Trust/Connect controls with real loopback SSH/SFTP and a fresh test process, plus native COM ABI.' >> $env:GITHUB_STEP_SUMMARY
          'STA control events are not physical keyboard input or a published EXE restart. Live Explorer gestures, DPI, High Contrast, motion recordings and clean Windows acceptance remain separate; see ACCEPTANCE.md.' >> $env:GITHUB_STEP_SUMMARY
          'Packaged EXE startup/normal close is a separate isolated CI process probe; it does not test password input or clean Windows.' >> $env:GITHUB_STEP_SUMMARY
          'Current composition renders are actual WPF client visuals from CI HWNDs with offline data. Exact published beta.4 and current source use matching fixtures, measured client sizes, culture, theme and recorded DPI/font role. Checks use routed control events and CI-only guarded software SendInput for held mouse/capture paths. Physical mouse and keyboard input remain NOT RUN. The renders do not capture native caption buttons or prove motion/physical gestures/accessibility acceptance.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Windows-regression-report-${{ github.sha }}
          path: |
            artifacts/build-test.log
            artifacts/portable-verification.json
            artifacts/portable-startup.json
            artifacts/portable-startup-diagnostics.jsonl
            artifacts/auth-network/*.log
            artifacts/auth-network/scope.json
            artifacts/ui-beta5-*.log
            artifacts/ui-beta5-before/**
            artifacts/ui-beta5-after/**
            artifacts/ui-beta5-interactions/**
            artifacts/ui-beta5-forms/**
            artifacts/ui-beta5-documents/**
            artifacts/ui-beta6.log
            artifacts/ui-beta6/**
            artifacts/package-measurements.json
            artifacts/webview2-system.json
            artifacts/exe-associated-icon.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: SSHExplorer-${{ github.sha }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
