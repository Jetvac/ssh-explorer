name: Windows build and regression
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare isolated SSH test fixture dependencies
        shell: pwsh
        run: |
          python -m venv .tools/auth-ci-python
          if ($LASTEXITCODE -ne 0) { throw 'Test Python environment creation failed.' }
          & .tools/auth-ci-python/Scripts/python.exe -m pip install -r scripts/testing/requirements-auth.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fixture dependency installation failed.' }
      - name: Build, run regression checks, package portable EXE
        id: package
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -RequireClean
          ./scripts/Package-Source.ps1 -RequireClean
      - name: Authentication network and ordinary WPF command route
        shell: pwsh
        run: ./scripts/Test-AuthNetwork.ps1 -Python .tools/auth-ci-python/Scripts/python.exe -RunOrdinaryUi
      - name: UI interactions, metric cells and exact beta.4 comparison renders
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/Test-UiComposition.ps1
      - name: Packaged EXE startup and graceful close in isolated settings
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props
          $version = [string]$properties.Project.PropertyGroup.Version
          ./scripts/Test-PortableStartup.ps1 -Directory "artifacts/SSHExplorer-$version-win-x64" -ExpectedCommit $env:GITHUB_SHA -ExpectedVersion $version
      - name: Record scope of CI checks
        if: always()
        shell: pwsh
        run: |
          'CI exercises core regressions, WPF layout/state, motion clocks, profile STA dialogs, ordinary Add/Trust/Connect controls with real loopback SSH/SFTP and a fresh test process, plus native COM ABI.' >> $env:GITHUB_STEP_SUMMARY
          'STA control events are not physical keyboard input or a published EXE restart. Live Explorer gestures, DPI, High Contrast, motion recordings and clean Windows acceptance remain separate; see ACCEPTANCE.md.' >> $env:GITHUB_STEP_SUMMARY
          'Packaged EXE startup/normal close is a separate isolated CI process probe; it does not test password input or clean Windows.' >> $env:GITHUB_STEP_SUMMARY
          'Current composition renders are actual WPF client visuals from CI HWNDs with offline data. Exact published beta.4 and current source use matching fixtures, measured client sizes, culture, theme and recorded DPI/font role. Checks use routed control events and CI-only guarded software SendInput for held mouse/capture paths. Physical mouse and keyboard input remain NOT RUN. The renders do not capture native caption buttons or prove motion/physical gestures/accessibility acceptance.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Windows-regression-report-${{ github.sha }}
          path: |
            artifacts/build-test.log
            artifacts/portable-verification.json
            artifacts/portable-startup.json
            artifacts/portable-startup-diagnostics.jsonl
            artifacts/auth-network/*.log
            artifacts/auth-network/scope.json
            artifacts/ui-beta5-*.log
            artifacts/ui-beta5-before/**
            artifacts/ui-beta5-after/**
            artifacts/ui-beta5-interactions/**
            artifacts/ui-beta5-forms/**
            artifacts/ui-beta5-documents/**
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: SSHExplorer-${{ github.sha }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
