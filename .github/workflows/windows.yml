name: Windows build and regression
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build, run regression checks, package portable EXE
        shell: pwsh
        run: |
          ./scripts/Build-Release.ps1 -RequireClean
          ./scripts/Package-Source.ps1 -RequireClean
      - name: Record scope of CI checks
        if: always()
        shell: pwsh
        run: |
          'CI exercises core regressions, WPF layout/state, profile STA dialogs and native COM ABI.' >> $env:GITHUB_STEP_SUMMARY
          'Live Explorer mouse gestures, DPI, High Contrast and clean Windows acceptance are separate checks; see ACCEPTANCE.md.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: SSHExplorer-${{ github.sha }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
