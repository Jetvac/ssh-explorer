name: Linux core, monitoring and collector benchmark
on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build Core/Monitoring tests
        run: |
          dotnet restore tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj --locked-mode
          dotnet build tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-restore
      - name: Regression tests on a real Linux /proc (protocol 2 collector, server info)
        run: |
          set -o pipefail
          dotnet run --project tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-build 2>&1 | tee artifacts-core.log
      - name: Real OpenSSH server and ssh-agent (0.3 A2 agent authentication)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends openssh-server > /dev/null
          fixture="$RUNNER_TEMP/sshd-agent"; mkdir -p "$fixture"; chmod 700 "$fixture"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/host_ed25519"
          ssh-keygen -q -t ed25519 -N '' -C 'ed25519@ci' -f "$fixture/client_ed25519"
          ssh-keygen -q -t rsa -b 3072 -N '' -C 'rsa@ci' -f "$fixture/client_rsa"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          cat "$fixture/client_ed25519.pub" "$fixture/client_rsa.pub" >> ~/.ssh/authorized_keys; chmod 600 ~/.ssh/authorized_keys
          {
            echo "Port 2222"; echo "ListenAddress 127.0.0.1"; echo "HostKey $fixture/host_ed25519"; echo "PidFile $fixture/sshd.pid"
            echo "PasswordAuthentication no"; echo "KbdInteractiveAuthentication no"; echo "PubkeyAuthentication yes"; echo "UsePAM yes"
            echo "StrictModes no"; echo "AuthorizedKeysFile %h/.ssh/authorized_keys"; echo "Subsystem sftp internal-sftp"
          } > "$fixture/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$fixture/sshd_config" -E "$fixture/sshd.log"
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q "$fixture/client_ed25519" "$fixture/client_rsa"
          empty_sock="$RUNNER_TEMP/empty-agent.sock"; ssh-agent -a "$empty_sock" > /dev/null
          # The sshd logs explain any refusal; printed whenever this step fails.
          trap 'for log in "$fixture"/*.log; do echo "::group::$(basename "$log")"; sudo cat "$log" || true; echo "::endgroup::"; done' ERR
          # Reference: the stock OpenSSH client logs in with the same agent and keys. If this fails, the fixture is wrong, not SSH Explorer.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 "$USER@127.0.0.1" 'printf reference-ok'; echo
          dotnet run --project tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-build -- --agent-integration 127.0.0.1 2222 "$USER" "$empty_sock" 2>&1 | tee artifacts-agent.log
          # 0.3 N1: real ss over SSH — our own listener must appear with its PID, process and owner.
          python3 -m http.server 18765 --bind 127.0.0.1 > /dev/null 2>&1 & listener=$!; sleep 1
          dotnet run --project tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-build -- --ports-integration 127.0.0.1 2222 "$USER" 18765 "$listener" 2>&1 | tee artifacts-ports.log
          kill "$listener" || true
          # 0.3 B1: interrupted uploads/downloads continue from verified partial files.
          dotnet run --project tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-build -- --resume-integration 127.0.0.1 2222 "$USER" 2>&1 | tee artifacts-resume.log

          # 0.3 A3 ProxyJump: the test runs in a network namespace that reaches only the bastion (10.200.1.1:2225).
          # The inner bastion (2224) and the target (2223) listen on the host loopback: reachable only through the chain.
          start_sshd() { # name listen-address port
            local conf="$fixture/sshd_$1"
            sed -e "s/^Port .*/Port $3/" -e "s/^ListenAddress .*/ListenAddress $2/" -e "s#^PidFile .*#PidFile $fixture/$1.pid#" "$fixture/sshd_config" > "$conf"
            sudo /usr/sbin/sshd -f "$conf" -E "$fixture/$1.log"
          }
          sudo ip netns add client
          sudo ip link add veth-host type veth peer name veth-client
          sudo ip link set veth-client netns client
          sudo ip addr add 10.200.1.1/24 dev veth-host && sudo ip link set veth-host up
          sudo ip netns exec client ip addr add 10.200.1.2/24 dev veth-client
          sudo ip netns exec client ip link set veth-client up && sudo ip netns exec client ip link set lo up
          start_sshd bastion 10.200.1.1 2225; start_sshd inner 127.0.0.1 2224; start_sshd target 127.0.0.1 2223
          dotnet_bin="$(command -v dotnet)"; tests_dll="$PWD/tests/SSHExplorer.Tests/bin/Release/net10.0/SSHExplorer.Tests.dll"
          sudo ip netns exec client sudo -u "$USER" env HOME="$HOME" SSH_AUTH_SOCK="$SSH_AUTH_SOCK" DOTNET_ROOT="${DOTNET_ROOT:-$(dirname "$dotnet_bin")}" DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            "$dotnet_bin" "$tests_dll" --jump-integration "$USER" 10.200.1.1 2225 2224 2223 2>&1 | tee artifacts-jump.log
          for pid in "$fixture"/*.pid; do sudo kill "$(cat "$pid")" || true; done
      - name: Collector benchmark beta.5 vs protocol 2 (same runner, +300 processes)
        run: |
          mkdir -p artifacts
          git show v0.2.0-beta.5:src/SSHExplorer.Monitoring/CollectorCommand.cs > artifacts/beta5-collector.cs
          dotnet run --project tests/SSHExplorer.Tests/SSHExplorer.Tests.csproj -c Release --no-build -- --collector-benchmark artifacts/beta5-collector.cs artifacts/collector-benchmark.json
          echo '### Collector benchmark' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat artifacts/collector-benchmark.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Linux-core-${{ github.sha }}
          path: |
            artifacts-core.log
            artifacts-agent.log
            artifacts-jump.log
            artifacts-resume.log
            artifacts-ports.log
            artifacts/collector-benchmark.json
          retention-days: 14
