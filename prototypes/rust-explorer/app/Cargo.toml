[package]
name = "sshx-explorer"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "SSH Explorer Rust prototype: native Win32 window over sshx-core (experiment, not a release)"
build = "build.rs"

[[bin]]
name = "sshx-rust-prototype"
path = "src/main.rs"

[dependencies]
sshx-core = { path = "../core" }

# Unconditional so the Win32 code also type-checks on other hosts (`cargo check`); it only links on Windows.
[dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
