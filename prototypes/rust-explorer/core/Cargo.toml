[package]
name = "sshx-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "SSH Explorer Rust prototype: terminal grid, typed sorting, host-key store, SSH/SFTP/PTY"

[features]
default = ["ssh"]
ssh = ["dep:ssh2"]

[dependencies]
vte = { version = "=0.13.1", default-features = false }
unicode-width = "=0.1.13"
ssh2 = { version = "=0.9.4", optional = true }
